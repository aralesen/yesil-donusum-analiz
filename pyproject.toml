# Kod denetimi ayarları. Kurallar aşamalı açılır: önce gerçek hatalar, sonra biçim.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# F  : gerçek hatalar (tanımsız ad, kullanılmayan değişken, kullanılmayan içe aktarma)
# B  : tuzaklar (eşleşmeyen zip, kullanılmayan döngü değişkeni, yanlış exception zinciri)
# E9 : sözdizimi ve çalışma zamanı hataları
# I  : içe aktarma düzeni
# UP : eski Python kalıpları
select = ["F", "B", "E9", "I", "UP", "SIM", "C4", "RET"]
# İlk aşamada kapalı: satır uzunluğu ve boşluk temizliği. Hazır olunca "E", "W" eklenir.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]          # testlerde kullanılmayan argüman normaldir

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = false  # mevcut koda uyum; zamanla açılabilir

[tool.pytest.ini_options]
testpaths = ["tests"]
